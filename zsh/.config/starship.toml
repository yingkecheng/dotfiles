"$schema" = 'https://starship.rs/config-schema.json'

# 版式:starship 内置 pure-preset(2026-08-24 由 powerline 换过来)——无背景块、无版本号堆,
# 一行「路径 + 分支」,换行后只有 ❯。配色换成 catppuccin_mocha,与 kitty/waybar/mako 一致。
# 路径不用 [directory](只能按层数截断,治不了单段 49 字符的包名),改读 zshrc 里 _pwd_short
# 算好的 $PWD_SHORT(按列数设硬上限)。改配置后老 shell 要 `exec zsh` 才会重新定义该钩子,
# 否则路径处显示 ? ——这是 default 值,不是坏了。

palette = 'catppuccin_mocha'

format = """
${env_var.PWD_SHORT}\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[env_var.PWD_SHORT]
variable = "PWD_SHORT"
default = "?"
format = "[$env_value](blue) "

[username]
disabled = true

[hostname]
disabled = true

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
vimcmd_visual_symbol = "[❮](yellow)"
vimcmd_replace_symbol = "[❮](lavender)"
vimcmd_replace_one_symbol = "[❮](lavender)"

[git_branch]
format = "[$branch]($style)"
style = "overlay1"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](flamingo) ($ahead_behind$stashed)]($style)"
style = "sapphire"
conflicted = "\u200b"
untracked = "\u200b"
modified = "\u200b"
staged = "\u200b"
renamed = "\u200b"
deleted = "\u200b"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "overlay1"

# 保留原配置的长命令通知:固件编译跑过 45s 就弹 mako,别丢
[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
show_milliseconds = true
show_notifications = true
min_time_to_notify = 45000

[python]
format = "[$virtualenv]($style) "
style = "overlay1"
detect_extensions = []
detect_files = []

